# =============================================================================
# Site
# =============================================================================
title: Earth.etc
home_title: Muhamad Nasir Lukman | Remote Sensing & Geospatial Data Science # <title> of the home page
job_title: Geospatial Data Scientist & Remote Sensing Analyst # used in structured data (SEO)
first_name: Muhamad
middle_name: Nasir
last_name: Lukman
email: muhamadnasirlukman@gmail.com
description: >
  Remote sensing and geospatial data science blog by Muhamad Nasir Lukman: hyperspectral imaging, radar, and machine learning for mining, forest, and environmental monitoring.
keywords: remote sensing, gis, geospatial data science, machine learning, hyperspectral imaging, spectral geology, radar, insar, mining monitoring, deforestation, earth observation, satellite
lang: en
icon: 🌏 # emoji favicon
url: https://nasirlukman.github.io
baseurl:
footer_text: >
  Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> with <a href="https://github.com/alshedivat/al-folio">al-folio</a> theme.
  Hosted by <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>.
last_updated: true # show "Last updated" in the footer

# Social links (navbar on the home page, and Schema.org "sameAs")
github_username: nasirlukman
linkedin_username: nasirlukman
rss_icon: false

# =============================================================================
# SEO
# =============================================================================
serve_og_meta: true
serve_schema_org: true
og_image: /assets/img/og/profile_picture.jpg # default social preview image
google_analytics: G-NY818B7N0G
google_site_verification: J8gUbUrDIfrV6xc8qbQht7JP22-dk7AGlCz8WwAUzYU
enable_google_analytics: true
enable_google_verification: true
enable_bing_verification: false # verified with BingSiteAuth.xml instead

# =============================================================================
# Layout & features
# =============================================================================
navbar_fixed: true
footer_fixed: true
max_width: 800px
enable_navbar_social: true
enable_medium_zoom: true # click images to zoom
enable_progressbar: true # reading progress bar
enable_math: true # MathJax, loaded only on pages that contain math
responsive_widths: [480, 800, 1400] # sizes of the pre-generated WebP images (name-480.webp ...)

# =============================================================================
# Blog
# =============================================================================
blog_name: Earth.etc
blog_description: Notes, experiments, and case studies in remote sensing, hyperspectral imaging, and geospatial data science.
permalink: /blog/:year/:title/
display_categories: ["Geoscience", "Environment", "OSINT", "Other"] # filter buttons on the blog page
related_blog_posts:
  enabled: true
  max_related: 3

jekyll-archives:
  enabled: [year, categories, tags]
  layouts:
    year: archive-year
    tag: archive-tag
    category: archive-category
  permalinks:
    year: "/blog/:year/"
    tag: "/blog/tag/:name/"
    category: "/blog/category/:name/"

external_links: # jekyll-link-attributes: open external links in a new tab
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:

# =============================================================================
# Build
# =============================================================================
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

sass:
  style: compressed

include: ["_pages"]
exclude:
  - bin
  - vendor
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - docker-compose.yml
  - build.log
  - purgecss.config.js
keep_files:
  - CNAME
  - .nojekyll

plugins:
  - jekyll-archives
  - jekyll-feed
  - jekyll-link-attributes
  - jekyll-sitemap

# =============================================================================
# Third-party library versions (loaded from CDN)
# =============================================================================
jquery:
  version: "3.6.0"
  integrity: "sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
mathjax:
  version: "3.2.0"
mdb:
  version: "4.20.0"
  integrity:
    css: "sha256-jpjYvU3G3N6nrrBwXJoVEYI/0zw8htfFnhT9ljN3JJw="
medium_zoom:
  version: "1.0.8"
  integrity: "sha256-7PhEpEWEW0XXQ0k6kQrPKwuoIomz8R8IYyuU1Qew4P8="
