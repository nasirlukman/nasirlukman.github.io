# Local preview: `docker compose up`, then open http://localhost:8080
# Uses the same Ruby version as the GitHub deploy. Gems are cached in a volume,
# so only the first start is slow.
services:
  jekyll:
    image: ruby:3.2
    working_dir: /srv/jekyll
    command: bash -c "bundle install && bundle exec jekyll serve --host 0.0.0.0 --port 8080 --livereload --force_polling"
    ports:
      - 8080:8080
      - 35729:35729
    volumes:
      - .:/srv/jekyll
      - bundle:/usr/local/bundle

volumes:
  bundle:
